openapi: 3.0.0
info:
  title: Ikimina MS API
  version: 1.1.0
  description: API for Ikimina Savings Group Management System
servers:
   - url: /
     description: Ikimina API server

tags:
   - name: Auth
     description: Authentication endpoints (register, login, password reset)
   - name: Members
     description: Member management endpoints (CRUD, approvals, status)
   - name: Loans
     description: Loan management endpoints (requests, status, schedules)
   - name: Repayments
     description: Repayment and installment management
   - name: Contributions
     description: Contribution recording and history
   - name: Attendance
     description: Meeting attendance management
   - name: Meetings
     description: Meeting scheduling and management
   - name: Announcements
     description: Announcements management
   - name: SMS
     description: SMS templates and notifications
   - name: Reports
     description: Various reports (loans, contributions, attendance, defaulters)
   - name: Dashboard
     description: Dashboard statistics
   - name: Loan Config
     description: Loan configuration settings
   - name: Roles
     description: Role and permission management endpoints

paths:
  /api/hello:
    get:
      summary: Health hello endpoint
      responses:
        '200':
          description: OK

  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRegister'
      responses:
        '201':
          description: Member registered successfully
        '400':
          description: Bad request

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login member or admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset token generated (returned in dev)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '400':
          description: Bad request

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using a valid reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
        '400':
          description: Invalid or expired token / bad request

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current member
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current member profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout member (invalidate session)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
        '401':
          description: Unauthorized

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /api/auth/verify-email/{token}:
    get:
      tags: [Auth]
      summary: Verify email with token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified successfully
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Invalid or expired token


  /api/members:
    get:
      tags: [Members]
      summary: List all members (admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: sortBy
          schema:
            type: string
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: role
          schema:
            type: string
            enum: [member, admin]
        - in: query
          name: isApproved
          schema:
            type: boolean
        - in: query
          name: isActive
          schema:
            type: boolean
        - in: query
          name: search
          description: Search by name, email, or phone
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)
        '422':
          description: Validation error
        '500':
          description: Internal server error
    post:
      tags: [Members]
      summary: Create a new member (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRegister'
      responses:
        '201':
          description: Member created
        '400':
          description: Bad request
        '403':
          description: Forbidden (not admin)


  /api/members/pending:
    get:
      tags: [Members]
      summary: Get pending member approvals (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of pending members
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)

  /api/members/{id}/approve:
    put:
      tags: [Members]
      summary: Approve member registration (admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Member approved
        '404':
          description: Member not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)

  /api/members/{id}/loans:
    get:
      tags: [Members]
      summary: Get member's loans summary
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of member's loans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin or member)
        '404':
          description: Member not found
        '422':
          description: Validation error
        '500':
          description: Internal server error

  /api/members/{id}/contributions:
    get:
      tags: [Members]
      summary: Get member's contribution history
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: fromDate
          schema:
            type: string
            format: date
        - in: query
          name: toDate
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Paginated list of member's contributions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin or member)
        '404':
          description: Member not found
        '422':
          description: Validation error
        '500':
          description: Internal server error

  /api/members/{id}/attendance:
    get:
      tags: [Members]
      summary: Get member's attendance record
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of member's attendance records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin or member)
        '404':
          description: Member not found
        '422':
          description: Validation error
        '500':
          description: Internal server error

  /api/members/{id}/documents:
    post:
      tags: [Members]
      summary: Upload member documents (ID, etc.) (admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                documentType:
                  type: string
                  enum: [id, passport, license, other]
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document uploaded successfully
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)
        '404':
          description: Member not found
        '500':
          description: Internal server error


  /api/members/{id}/status:
    put:
      tags: [Members]
      summary: Activate or suspend a member (admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberStatusUpdate'
      responses:
        '200':
          description: Member status updated
        '404':
          description: Member not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)

  /api/members/{id}/reset-password:
    put:
      tags: [Members]
      summary: Reset a member password (admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberResetPassword'
      responses:
        '200':
          description: Password reset successfully
        '404':
          description: Member not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)

  /api/members/me:
    put:
      tags: [Members]
      summary: Update own profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberProfileUpdate'
      responses:
        '200':
          description: Profile updated
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /api/loans:
    post:
      tags: [Loans]
      summary: Submit a loan request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanRequest'
      responses:
        '201':
          description: Loan request submitted
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '422':
          description: Validation error
    get:
      tags: [Loans]
      summary: Get all loans (admin) or member's loans
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: sortBy
          schema:
            type: string
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected, disbursed, completed, overdue]
        - in: query
          name: fromDate
          schema:
            type: string
            format: date
        - in: query
          name: toDate
          schema:
            type: string
            format: date
        - in: query
          name: memberId
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of loans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
        '500':
          description: Internal server error



  /api/loans/preview:
    post:
      tags: [Loans]
      summary: Preview loan repayment calculations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, termMonths]
              properties:
                amount:
                  type: number
                termMonths:
                  type: integer
                interestRate:
                  type: number
      responses:
        '200':
          description: Preview calculated
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount:
                    type: number
                  interestRate:
                    type: number
                  termMonths:
                    type: integer
                  totalRepayment:
                    type: number
                  monthlyInstallment:
                    type: number
                  interest:
                    type: number
        '401':
          description: Unauthorized
        '400':
          description: Bad request
        '500':
          description: Internal server error

  /api/loans/stats:
    get:
      tags: [Loans]
      summary: Loan statistics summary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Loan statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoansReport'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)
        '500':
          description: Internal server error

  /api/loans/{id}:
    get:
      tags: [Loans]
      summary: Get loan by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Loan details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '404':
          description: Loan not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin or loan owner)
    put:
      tags: [Loans]
      summary: Update loan status (approve/reject/disbursed/completed)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanUpdate'
      responses:
        '200':
          description: Loan updated
        '404':
          description: Loan not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)

  /api/repayments/history:
     get:
       tags: [Repayments]
       summary: General repayment history (admin only)
       security:
         - bearerAuth: []
       parameters:
         - in: query
           name: page
           schema:
             type: integer
             default: 1
         - in: query
           name: limit
           schema:
             type: integer
             default: 20
         - in: query
           name: fromDate
           schema:
             type: string
             format: date
         - in: query
           name: toDate
           schema:
             type: string
             format: date
         - in: query
           name: memberId
           schema:
             type: string
       responses:
         '200':
           description: Paginated list of repayment history
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/PaginatedResponse'
         '401':
           description: Unauthorized
         '403':
           description: Forbidden (not admin)
         '422':
           description: Validation error
         '500':
           description: Internal server error
   
  /api/repayments/overdue:
    get:
      tags: [Repayments]
      summary: List overdue payments (admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: fromDate
          schema:
            type: string
            format: date
        - in: query
          name: toDate
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Paginated list of overdue payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)
        '422':
          description: Validation error
        '500':
          description: Internal server error

  # Batch Operations
  /api/members/batch:
    post:
      tags: [Members]
      summary: Bulk import members (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                members:
                  type: array
                  items:
                    $ref: '#/components/schemas/MemberRegister'
      responses:
        '200':
          description: Members imported successfully
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)

  /api/contributions/batch:
    post:
      tags: [Contributions]
      summary: Bulk record contributions (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contributions:
                  type: array
                  items:
                    $ref: '#/components/schemas/ContributionRecord'
      responses:
        '200':
          description: Contributions recorded successfully
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)

  /api/sms/batch:
    post:
      tags: [SMS]
      summary: Bulk send SMS
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsBroadcast'
      responses:
        '200':
          description: SMS batch sent successfully
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)

  /api/repayments/installments/{installmentId}:
    get:
      tags: [Repayments]
      summary: Get a single repayment installment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: installmentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Installment details
        '401':
          description: Unauthorized
    put:
      tags: [Repayments]
      summary: Record a repayment payment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: installmentId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepaymentPayRequest'
      responses:
        '200':
          description: Payment recorded
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /api/attendance:
    get:
      tags: [Attendance]
      summary: Get attendance records
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: memberId
          schema:
            type: string
        - in: query
          name: meetingId
          schema:
            type: string
      responses:
        '200':
          description: Attendance records
        '401':
          description: Unauthorized
    post:
      tags: [Attendance]
      summary: Mark attendance (via QR or manual)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceMark'
      responses:
        '201':
          description: Attendance marked
        '400':
          description: Bad request
        '401':
          description: Unauthorized

  /api/attendance/{id}/verify:
    put:
      tags: [Attendance]
      summary: Verify attendance (admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attendance verified
        '404':
          description: Attendance record not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)

  /api/contributions:
    get:
      tags: [Contributions]
      summary: Get contribution records
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: sortBy
          schema:
            type: string
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: memberId
          schema:
            type: string
        - in: query
          name: week
          schema:
            type: string
            format: date
        - in: query
          name: fromDate
          schema:
            type: string
            format: date
        - in: query
          name: toDate
          schema:
            type: string
            format: date
        - in: query
          name: status
          schema:
            type: string
            enum: [paid, pending, overdue]
      responses:
        '200':
          description: Paginated list of contributions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '401':
          description: Unauthorized
        '422':
          description: Validation error
        '500':
          description: Internal server error
    post:
      tags: [Contributions]
      summary: Record a contribution (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContributionRecord'
      responses:
        '201':
          description: Contribution recorded
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)


  /api/announcements:
    get:
      tags: [Announcements]
      summary: Get announcements (with optional filtering)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: activeOnly
          schema:
            type: string
            enum: ['true', 'false']
            default: 'true'
      responses:
        '200':
          description: List of announcements
        '401':
          description: Unauthorized
    post:
      tags: [Announcements]
      summary: Create an announcement (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementCreate'
      responses:
        '201':
          description: Announcement created
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not admin)

  /api/announcements/{id}:
    get:
      tags: [Announcements]
      summary: Get announcement by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Announcement details
        '404':
          description: Announcement not found
        '401':
          description: Unauthorized
    put:
