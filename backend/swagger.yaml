components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    Error:
      type: object
      properties:
        success:
          type: boolean
          default: false
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time
        path:
          type: string
    MemberUpdate:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        role:
          type: string
    MemberStatusUpdate:
      type: object
      required: [isActive]
      properties:
        isActive:
          type: boolean

    MemberResetPassword:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 6

    MemberProfileUpdate:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string

    MemberRegister:
      type: object
      required: [email, nationalId, password, fullName, phone]
      properties:
        email:
          type: string
          format: email
          minLength: 5
          maxLength: 100
        nationalId:
          type: string
          pattern: '^[0-9]{16}$'  # Example for 16-digit ID
          minLength: 16
          maxLength: 16
        password:
          type: string
          minLength: 6
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: '^\+?[0-9]{10,15}$'
        role:
          type: string
          default: member


    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ForgotPasswordResponse:
      type: object
      properties:
        msg:
          type: string
        _devResetToken:
          type: string
          description: Reset token returned only in development mode

    ResetPasswordRequest:
      type: object
      required: [token, newPassword, email]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 6
        email:
          type: string
          format: email

    ResetPasswordResponse:
      type: object
      properties:
        msg:
          type: string
        token:
          type: string
          description: New JWT token

    SwitchLoginRequest:
      type: object
      required: [phone, pin]
      properties:
        phone:
          type: string
        pin:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        nationalId:
          type: string
        fullName:
          type: string
        role:
          type: string
        isApproved:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time

    Loan:
      type: object
      properties:
        id:
          type: string
        memberId:
          type: string
        amount:
          type: number
        interestRate:
          type: number
        termMonths:
          type: integer
        status:
          type: string
          enum: [pending, approved, rejected, disbursed, completed, overdue]
        requestDate:
          type: string
          format: date-time
        approvalDate:
          type: string
          format: date-time
        disbursementDate:
          type: string
          format: date-time
        dueDate:
          type: string
          format: date-time
        balance:
          type: number

    LoanRequest:
      type: object
      required: [amount, termMonths]
      properties:
        amount:
          type: number
          minimum: 1
        interestRate:
          type: number
          minimum: 0
        termMonths:
          type: integer
          minimum: 1

    LoanUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [approved, rejected, disbursed, completed]
        disbursementDate:
          type: string
          format: date-time

    RepaymentSchedule:
      type: object
      properties:
        id:
          type: string

    RepaymentPayRequest:
      type: object
      required: [amount, paymentMethod]
      properties:
        amount:
          type: number
        paymentMethod:
          type: string

    Attendance:
      type: object
      properties:
        id:
          type: string
        memberId:
          type: string
        meetingId:
          type: string
        timestamp:
          type: string
          format: date-time
        verified:
